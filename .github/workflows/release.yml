name: Release (on tag)

on:
  push:
    tags: ["v*"]
  # Cut starts this workflow on the tag it creates: a tag pushed with GITHUB_TOKEN
  # does not trigger `push`, but `workflow_dispatch` does. Keeping this a top-level
  # workflow (not `workflow_call`) is what PyPI Trusted Publishing requires.
  workflow_dispatch:

permissions: {}

jobs:
  build:
    # Manual runs must target a release tag: gh workflow run release.yml --ref vX.Y.Z
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build  # creates dist/*.whl and *.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Publishing is its own job so that only this job can mint a PyPI token.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ctrl-freeq/
    permissions:
      id-token: write   # Trusted Publishing (OIDC); no API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub release
      packages: write   # GHCR
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Derive version & prerelease flag
        id: ver
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> $GITHUB_OUTPUT
          if [[ "$V" =~ (a|b|rc)[0-9]+ ]]; then echo "pre=true" >> $GITHUB_OUTPUT; else echo "pre=false" >> $GITHUB_OUTPUT; fi
          MINOR_PART=${V#*.}
          echo "minor=${MINOR_PART%%.*}" >> $GITHUB_OUTPUT

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.ver.outputs.pre }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/ctrlfreeq"
          V="${{ steps.ver.outputs.version }}"
          docker build -t "$IMAGE:$V" .

      - name: Tag channels and push
        shell: bash
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/ctrlfreeq"
          V="${{ steps.ver.outputs.version }}"
          MAJOR="${V%%.*}"
          MINOR="${{ steps.ver.outputs.minor }}"
          docker tag "$IMAGE:$V" "$IMAGE:v$V"
          docker push "$IMAGE:$V"
          docker push "$IMAGE:v$V"
          if [[ "$V" =~ (a|b|rc)[0-9]+ ]]; then
            docker tag "$IMAGE:$V" "$IMAGE:beta"
            docker push "$IMAGE:beta"
          else
            docker tag "$IMAGE:$V" "$IMAGE:$MAJOR.$MINOR"
            docker tag "$IMAGE:$V" "$IMAGE:$MAJOR"
            docker tag "$IMAGE:$V" "$IMAGE:latest"
            docker push "$IMAGE:$MAJOR.$MINOR"
            docker push "$IMAGE:$MAJOR"
            docker push "$IMAGE:latest"
          fi

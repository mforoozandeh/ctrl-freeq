name: Renovate

on:
  schedule:
    - cron: '0 23 * * 0'
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      log-level:
        description: Log level (debug/info/warn/error)
        default: info
      ignore-schedule:
        description: Bypass Renovate schedule for this run
        type: boolean
        default: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: renovate-${{ github.repository }}
      cancel-in-progress: true
    # Renovate authenticates with the GitHub App token below; GITHUB_TOKEN is unused.
    permissions: {}
    env:
      LOG_LEVEL: ${{ github.event.inputs.log-level }}
      RENOVATE_REPOSITORIES: ${{ github.repository }}
      RENOVATE_BINARY_SOURCE: install

    steps:
      # Only for manual runs when "ignore-schedule" is true:
      - name: Bypass Renovate schedule (manual runs)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ignore-schedule == 'true' }}
        run: |
          echo 'RENOVATE_CONFIG={"force":{"schedule":["at any time"]}}' >> "$GITHUB_ENV"

      # Short-lived (1h) installation token, scoped to this repository only.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@v43.0.20
        with:
          renovate-version: latest
          token: ${{ steps.app-token.outputs.token }}
